<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55A8FF" />
      <stop offset="100%" stop-color="#195CE6" />
    </linearGradient>
    <linearGradient id="ringShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E0E0" />
    </linearGradient>
  </defs>

  <!-- Main blue circle background -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" stroke="#1648C2" stroke-width="2"/>
  
  <!-- Gloss overlay for 3D effect -->
  <path d="M 6 100 A 94 94 0 0 1 194 100 A 130 65 0 0 0 6 100 Z" fill="white" opacity="0.15" />

  <!-- Inner White Ring -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#ringShadow)" stroke-width="14" />

  <!-- Accessibility Figure -->
  <circle cx="100" cy="58" r="14" fill="white" />
  <g fill="none" stroke="white" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arms -->
    <path d="M 52,85 Q 100,93 148,85" />
    <!-- Torso -->
    <path d="M 100,88 L 100,126" />
    <!-- Legs -->
    <path d="M 100,124 L 80,162" />
    <path d="M 100,124 L 120,162" />
  </g>
</svg>
