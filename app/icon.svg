<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="20%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#FEF08A">
        <animate attributeName="stop-color" values="#FBBF24;#FFFFFF;#FBBF24" dur="2s" repeatCount="indefinite" />
      </stop>
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
      <animate attributeName="x1" values="-100%;100%" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="2.5s" repeatCount="indefinite" />
    </linearGradient>
    <mask id="moonMask">
      <rect x="0" y="0" width="64" height="64" fill="white" />
      <!-- Cutout circle shifted up and right to form the crescent -->
      <circle cx="49" cy="25" r="15" fill="black" />
    </mask>
  </defs>

  <!-- Dark Background -->
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>
  
  <!-- 'F' -->
  <path d="M 14 16 L 26 16 L 26 20 L 18 20 L 18 26 L 24 26 L 24 30 L 18 30 L 18 44 L 14 44 Z" fill="url(#goldShimmer)"/>
  
  <!-- 'L' as a Crescent Moon -->
  <circle cx="44" cy="30" r="15" fill="url(#goldShimmer)" mask="url(#moonMask)" />

  <!-- Little Sparkle for extra shimmer effect -->
  <path d="M 52 14 Q 52 18 48 18 Q 52 18 52 22 Q 52 18 56 18 Q 52 18 52 14 Z" fill="url(#goldShimmer)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" />
  </path>
</svg>
